# Default parameters of ssl_simulator::SslSimulatorNode. All parameters are read-only.
/**:
  ros__parameters:
    # Index of the mat: topic ssl_<node_id>/map, frame ssl_frame_<node_id>.
    node_id: 1
    frame_period: 0.023

    # Pose of the corner of cell (0, 0) in the map frame [m, rad] and size of the mat [m].
    x: 0.0
    y: 0.0
    z: 0.011
    heading: 0.0
    width: 10.0
    height: 5.0
    resolution: 0.2

    threshold: 10
    stale_seconds: 0.5
    microscale: false

    # Declared by diagnostic_updater::Updater.
    diagnostic_updater:
      period: 1.0
      use_fqn: true
