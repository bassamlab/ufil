# Minimal robot_localization configuration for the launch test.
/**:
  ekf_filter_node_odom:
    ros__parameters:
      frequency: 10.0
      two_d_mode: true
      odom0: odometry/wheel
      odom0_config: [false, false, false, false, false, false,
                     true, true, true, false, false, false,
                     false, false, false]
  ekf_filter_node_map:
    ros__parameters:
      frequency: 10.0
      two_d_mode: true
      odom0: odometry/wheel
      odom0_config: [false, false, false, false, false, false,
                     true, true, true, false, false, false,
                     false, false, false]
      publish_acceleration: true
  navsat_transform_node:
    ros__parameters:
      frequency: 5.0
      wait_for_datum: false
