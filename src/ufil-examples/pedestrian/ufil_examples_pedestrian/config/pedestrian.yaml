# Parameters of all nodes of the pedestrian example, for the head (visualization) and the
# headless (simulator, tracker) machine. Loaded with launch substitutions (allow_substs), so
# installed files are given with find-pkg-share; a dollar sign must not be used otherwise, not
# even in comments. Values not given here are the package defaults. The scenario of the simulator
# is selected with the scenario argument of the launch files.

# --- Head: visualization ---------------------------------------------------------------------

# Synthetic four-way intersection, published on /map.
/lanelet_map_marker_array:
  ros__parameters:
    map_path: $(find-pkg-share ufil_examples_pedestrian)/maps/four_way_intersection.osm
    frame_id: map_utm

# Object markers, each source on its own topic (sources of ufil_visualization/ufil_sources.yaml
# replaced): tracks of the outdoor sensor node in blue, the ground truth of the simulator in light
# grey (#deddda) and the simulated detections in red (#e01b24).
/object_list_marker_array:
  ros__parameters:
    sources: [osn, reference, measured]
    reference:
      input_topic: /ufil_examples_pedestrian/reference_objects
      output_topic: /ufil_examples_pedestrian/reference_markers
      color: [0.871, 0.867, 0.855, 1.0]
    measured:
      input_topic: /ufil_examples_pedestrian/measured_objects
      output_topic: /ufil_examples_pedestrian/measured_markers
      color: [0.878, 0.106, 0.141, 1.0]

# --- Headless: simulator and tracker ---------------------------------------------------------

# Simulated detections in the map frame every 0.1 s.
/ufil_examples_pedestrian/pedestrian_simulator:
  ros__parameters:
    timestep: 0.1
    frame_id: map

# Tracker of the outdoor sensor node.
/osn/pedestrian_tracker:
  ros__parameters:
    process_noise: 10.0
    track_timeout: 1.0
    max_time_gap: 1.0
