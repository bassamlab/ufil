# Parameters of all nodes of the CPM Lab example, for the head (vehicles, visualization) and the
# headless (infrastructure) machine. Loaded with launch substitutions (allow_substs), so installed
# files are given with find-pkg-share; a dollar sign must not be used otherwise, not even in
# comments. Values not given here are the package defaults. The single-machine launch file
# cpm-lab.launch.xml overrides machine-specific values with cpm-lab_local.yaml.

# --- Head: on-board units of the vehicles 12, 13, 15, 17, 18 and 19 --------------------------

# Lab adapter publishing all vehicles in /obu/object_list_unfiltered, and each one alone in
# /obu/vehicle_<id>/object_list for its on-board unit.
/obu/cpm_lab_adapter:
  ros__parameters:
    vehicle_ids: [12, 13, 15, 17, 18, 19]
    target_frame: map

# CAM generation of every vehicle; ETSI time starts in 2004.
/**/vehicle_cam_generator_node:
  ros__parameters:
    time_shift_nanosec: 500000000000
    target_frame: utm_32n

# ETSI encoding of the CAMs of every vehicle.
/**/cam_encoder:
  ros__parameters:
    udp2ros_etsi_types: [""]
    ros2udp_etsi_types: [cam]
    has_btp_destination_port: true
    btp_destination_port_offset: 0
    etsi_message_payload_offset: 4

# CAMs of every vehicle are sent to the RSU of the headless machine.
/**/udp_sender:
  ros__parameters:
    target_address: 192.168.1.41
    target_port: 5000

# Objects within the lab area (vertices [x1, y1, x2, y2, ...] in the map frame [m]). Also used
# by the RSU filter of the headless machine.
/**/object_list_position_filter:
  ros__parameters:
    area_of_interest:
      enabled: true
      vertices: [81.0, 30.0, 81.0, 46.0, 0.0, 46.0, 0.0, 30.0]

# --- Head: visualization ---------------------------------------------------------------------

# Object markers of the sources of ufil_visualization/ufil_sources.yaml; the road-side unit is
# shown before its position filter.
/object_list_marker_array:
  ros__parameters:
    rsu:
      input_topic: /rsu/object_list_unfiltered

/lanelet_map_marker_array_node:
  ros__parameters:
    map_path: $(find-pkg-share ufil_examples_cpm_lab)/maps/A61 Lanelet2.osm
    frame_id: map_utm

# --- Headless: outdoor sensor node -----------------------------------------------------------

/osn/ufil_pcl_preprocessor:
  ros__parameters:
    static_object_file: $(find-pkg-share ufil_examples_cpm_lab)/config/sfb_demonstrator.csv
    restamp_output: true
    filter:
      z_min: 0.4
      min_neighbors: 10
    fov:
      num_bins: 5
    occlusion_grid:
      decay_rate: 0.1

# --- Headless: road side unit ----------------------------------------------------------------

/rsu/cam/udp_receiver:
  ros__parameters:
    listen_port: 5000

# ETSI decoding of the received CAMs.
/rsu/cam/cam_decoder:
  ros__parameters:
    udp2ros_etsi_types: [cam]
    ros2udp_etsi_types: [""]
    has_btp_destination_port: true
    btp_destination_port_offset: 0
    etsi_message_payload_offset: 4

/rsu/cam/vehicle_cam_receiver_node:
  ros__parameters:
    time_shift_nanosec: 500000000000
    target_frame: map

# Fusion of the CAMs, the outdoor sensor node and the sensitive surface layer.
/rsu/central_fusion:
  ros__parameters:
    sensor_names: [cam, osn, ssl]
    cam:
      topic: /rsu/cam/object_list
      fov_topic: ""
      occlusion_topic: ""
      is_cam: true
      trust:
        existence: 0.8
        car: 0.8
        truck: 0.8
        motorcycle: 0.8
        bicycle: 0.8
        pedestrian: 0.8
        stationary: 0.8
        other: 0.8
    osn:
      topic: /osn/object_list
      fov_topic: /osn/sensor_fov
      occlusion_topic: /osn/dynamic_occlusion_grid
      is_cam: false
      trust:
        existence: 0.8
        car: 0.8
        truck: 0.8
        motorcycle: 0.8
        bicycle: 0.8
        pedestrian: 0.8
        stationary: 0.8
        other: 0.8
    ssl:
      topic: /ssl/object_list
      fov_topic: ""
      occlusion_topic: ""
      is_cam: false
      trust:
        existence: 0.8
        car: 0.8
        truck: 0.8
        motorcycle: 0.8
        bicycle: 0.8
        pedestrian: 0.8
        stationary: 0.8
        other: 0.8

# --- Headless: sensitive surface layer (two mats) --------------------------------------------

/ssl/ssl_wheel_tracker:
  ros__parameters:
    input_topics: [/ssl_1, /ssl_2]

/ssl/ssl_vehicle_tracking:
  ros__parameters:
    vehicle_templates: [muCar_scaled_lab.json]
