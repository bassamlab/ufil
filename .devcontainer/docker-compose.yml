services:
  dev:
    env_file: .env
    # Built locally
    image: ufil-devcontainer:local
    build:
      context: ../docker
      target: dev
      args:
        USERNAME: ufil
    # Headless: no X11 socket, Xauthority or DISPLAY is passed in; visualize via foxglove_bridge
    # on port 8765.
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
    ports:
      - "8765:8765"
    volumes:
      - ..:/home/ufil/ws
      - ${HOME}/.gitconfig:/home/ufil/.gitconfig
      - ${HOME}/.ssh:/home/ufil/.ssh:ro
      - ${BAGS_DIR}:/bags:ro
    command: sleep infinity
