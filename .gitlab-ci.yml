stages:
  - build-devimage
  - publish-devimage
  - build
  - test
  - sync-github

variables:
  DEVCONTAINER_IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE/devcontainer
  DEVCONTAINER_IMAGE: $CI_REGISTRY_IMAGE/devcontainer:$CI_COMMIT_SHA
  DEVCONTAINER_USERNAME: ci
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  GITHUB_MIRROR_BRANCH: main

# ---------------------------------------------------------------------------
# Stage 1 – Build the dev container image for each architecture
# ---------------------------------------------------------------------------
.kaniko-devimage-build:
  stage: build-devimage
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    # Provide registry credentials to Kaniko
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/.devcontainer/Dockerfile.ufil" \
        --build-arg "USERNAME=$DEVCONTAINER_USERNAME" \
        --destination "$DEVCONTAINER_IMAGE_REPOSITORY:$CI_COMMIT_SHA-$ARCH" \
        --custom-platform "linux/$ARCH" \
        --snapshot-mode=redo \
        --use-new-run \
        --single-snapshot \
        --cleanup \
        --cache=true \
        --compressed-caching=false \
        --cache-repo "$DEVCONTAINER_IMAGE_REPOSITORY/cache"
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-devimage-amd64:
  extends: .kaniko-devimage-build
  tags:
    - amd64
  variables:
    ARCH: amd64

build-devimage-arm64:
  extends: .kaniko-devimage-build
  tags:
    - arm64
  variables:
    ARCH: arm64

# ---------------------------------------------------------------------------
# Stage 2 – Publish the multi-arch dev container image
# ---------------------------------------------------------------------------
publish-devimage:
  stage: publish-devimage
  image:
    name: mplatform/manifest-tool:alpine-v2.1.9
    entrypoint: [""]
  needs:
    - job: build-devimage-amd64
    - job: build-devimage-arm64
  script:
    - |
      manifest-tool \
        --username "$CI_REGISTRY_USER" \
        --password "$CI_REGISTRY_PASSWORD" \
        push from-args \
        --platforms linux/amd64,linux/arm64 \
        --template "$DEVCONTAINER_IMAGE_REPOSITORY:$CI_COMMIT_SHA-ARCH" \
        --target "$DEVCONTAINER_IMAGE"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        manifest-tool \
          --username "$CI_REGISTRY_USER" \
          --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$DEVCONTAINER_IMAGE_REPOSITORY:$CI_COMMIT_SHA-ARCH" \
          --target "$DEVCONTAINER_IMAGE_REPOSITORY:latest"
      fi

  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Stage 3 – Build the ROS workspace using the published dev container image
# ---------------------------------------------------------------------------
build:
  stage: build
  image: $DEVCONTAINER_IMAGE
  needs:
    - publish-devimage
  before_script:
    - source /opt/ros/jazzy/setup.bash
    - sudo apt-get update
    - rosdep update --rosdistro jazzy
    - rosdep install --from-paths src --ignore-src -y
        --skip-keys "python3-ultralytics-pip"
  script:
    - python3 -m colcon build
        --symlink-install
        --cmake-force-configure
        --base-paths ./src/
        --cmake-args
          "-DCMAKE_EXPORT_COMPILE_COMMANDS=On"
          "-DCMAKE_BUILD_TYPE=Release"
          "-DCMAKE_CXX_FLAGS_RELEASE=-O2"
          "-Wall"
          "-Wextra"
          "-Wpedantic"
          "-Wno-dev"
          "-Wno-psabi"
  artifacts:
    paths:
      - build/
      - install/
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Stage 4 – Run all tests using the built artifacts
# ---------------------------------------------------------------------------
test:
  stage: test
  image: $DEVCONTAINER_IMAGE
  needs:
    - build
  before_script:
    - source /opt/ros/jazzy/setup.bash
    - source install/setup.bash
  script:
    - python3 -m colcon test
        --base-paths ./src/
        --return-code-on-test-failure
    - python3 -m colcon test-result
        --verbose
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Stage 5 – Sync flattened workspace snapshot to GitHub on tag creation only
# ---------------------------------------------------------------------------
sync-github-mirror:
  stage: sync-github
  image: alpine:3.20
  before_script:
    - apk add --no-cache git openssh-client bash
    - mkdir -p ~/.ssh
    - printf '%s\n' "$GITHUB_MIRROR_DEPLOY_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -euo pipefail

      # GitLab already checked out all submodules via GIT_SUBMODULE_STRATEGY: recursive.
      # Copy the working tree instead of re-cloning (avoids needing RWTH GitLab SSH access).
      cp -r "$CI_PROJECT_DIR" /tmp/mirror-src
      cd /tmp/mirror-src

      # Remove UofA-related paths recursively from the mirrored snapshot.
      find src -depth -type d -iname '*uofa*' -exec rm -rf {} + || true

      # Convert the checkout into a plain repository snapshot.
      # Remove all .git metadata (root + all nested submodule .git dirs/files at any depth).
      find . -name .git -exec rm -rf {} + || true
      rm -f .gitmodules

      git init
      git config user.email "${GITHUB_MIRROR_USER_EMAIL:-ci-mirror@local}"
      git config user.name "${GITHUB_MIRROR_USER_NAME:-CI Mirror}"
      git add -A
      git commit -m "$CI_COMMIT_TAG"
      git branch -M "$GITHUB_MIRROR_BRANCH"

      # Ensure the remote uses SSH even if GITHUB_MIRROR_URL is an HTTPS URL
      SSH_MIRROR_URL=$(echo "$GITHUB_MIRROR_URL" | sed 's|https://github.com/|git@github.com:|')
      git remote add origin "$SSH_MIRROR_URL"
      git tag -f "$CI_COMMIT_TAG"
      git push --force origin "$GITHUB_MIRROR_BRANCH"
      git push --force origin "refs/tags/$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
